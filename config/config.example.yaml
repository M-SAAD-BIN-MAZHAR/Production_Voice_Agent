# Real-Time Voice Agent Configuration Example
# Copy this file to config.yaml and fill in your API keys

# Speech-to-Text Configuration
stt_provider: deepgram  # Options: deepgram, google
deepgram_api_key: YOUR_DEEPGRAM_API_KEY_HERE
stt_model: nova-2  # Deepgram model name
stt_language: en-US  # Language code

# Large Language Model Configuration
openai_api_key: YOUR_OPENAI_API_KEY_HERE
llm_model: gpt-4o-mini  # Options: gpt-4o-mini, gpt-4o, gpt-4, gpt-3.5-turbo
system_prompt: |
  You are a helpful voice assistant. Provide concise, natural responses 
  suitable for speech output. Keep responses brief and conversational.

# Text-to-Speech Configuration
tts_provider: openai  # Options: openai, edge-tts
tts_voice: alloy  # OpenAI voices: alloy, echo, fable, onyx, nova, shimmer
                  # Edge-TTS voice: en-US-AriaNeural
tts_model: tts-1  # Options: tts-1, tts-1-hd (OpenAI only)

# Voice Activity Detection Configuration
vad_provider: silero  # Options: silero, deepgram
vad_threshold: 0.5  # Speech detection threshold (0.0-1.0)
vad_silence_duration_ms: 700  # Milliseconds of silence before endpoint

# Audio Configuration
sample_rate: 16000  # Audio sample rate in Hz (8000, 16000, 24000, 44100, 48000)
chunk_duration_ms: 100  # Audio chunk duration in milliseconds

# Memory Configuration
memory_max_turns: 10  # Maximum conversation turns to store
memory_similarity_top_k: 5  # Number of similar turns to retrieve
memory_recent_turns: 3  # Number of recent turns to always include
vector_db_path: ./data/conversation_memory  # Path to FAISS index

# Performance Configuration
target_latency_ms: 1500  # Target end-to-end latency in milliseconds

# Logging Configuration
log_level: INFO  # Options: DEBUG, INFO, WARNING, ERROR, CRITICAL
